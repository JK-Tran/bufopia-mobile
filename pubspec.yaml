name: bufopia
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  android_id: ^0.5.2+1
  async: ^2.13.1
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  clock: ^1.1.3
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  dartx: ^1.2.0
  decimal: ^3.2.6
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.5
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  injectable: ^3.0.0
  internet_connection_checker: ^1.0.0+1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  meta: ^1.19.0
  mime: ^2.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  retrofit: ^4.10.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.11
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/icons/
    - assets/sounds/
    - assets/images/webp/
    - assets/images/quick_battle/
    - assets/images/background_switch/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_android: "assets/images/playstore.png"
  image_path_ios: "assets/images/appstore.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/playstore.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_android12.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/images/splash_android12.png"
  android_12:
    image: "assets/images/splash_android12.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/images/splash_android12.png"
    icon_background_color_dark: "#FFFFFF"
  fullscreen: true
